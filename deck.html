<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ממורה למפתח</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Rubik:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* כיוון: מסך של מפתחים. כחול-לילה עמוק, סגול חשמלי וטורקיז, חלונות זכוכית וטרמינל.
   הרגע הבולט: בפתיחה הבינה "בונה" את האתר מול העיניים */
:root{--bg:#070B1F;--bg2:#0E1433;--violet:#8B5CF6;--cyan:#22D3EE;--pink:#F472B6;--txt:#F2F5FF;--muted:#8E98C2;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#03050F;font-family:'Rubik',sans-serif;color:var(--txt)}
#vp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{width:1600px;height:900px;flex:0 0 auto;position:relative;overflow:hidden;background:var(--bg)}
/* רקע: זוהר סגול וטורקיז ורשת נקודות עדינה */
#deck::before{content:'';position:absolute;inset:-20%;background:
  radial-gradient(40% 45% at 85% 15%,rgba(139,92,246,.35),transparent 70%),
  radial-gradient(35% 40% at 10% 90%,rgba(34,211,238,.22),transparent 70%);filter:blur(10px)}
#deck::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.2px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
.s{position:absolute;inset:0;padding:84px 110px 96px;display:none;z-index:1}
.s.on{display:flex}
h1,h2,.mcard .nm{font-family:'Space Grotesk','Rubik',sans-serif}
h1,h2{font-weight:900;margin:0;line-height:.98;letter-spacing:-1px}
h2{font-size:92px}
p{margin:0}
.grad{background:linear-gradient(100deg,#fff 10%,var(--cyan) 45%,var(--violet) 75%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:34px;line-height:1.5;color:var(--muted);font-weight:300}
.mono{font-family:'JetBrains Mono','Rubik',monospace}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(8px)}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;font:700 22px 'JetBrains Mono','Rubik';color:var(--cyan);border:1px solid rgba(34,211,238,.4);border-radius:999px;padding:6px 18px;background:rgba(34,211,238,.08)}
.chip::before{content:'';width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}

/* מסגרת HUD: סוגריים בפינות ושורת סטטוס */
.hud{position:absolute;inset:26px;z-index:4;pointer-events:none}
.hud i{position:absolute;width:34px;height:34px;border-color:rgba(34,211,238,.55);border-style:solid;border-width:0}
.hud i:nth-child(1){top:0;right:0;border-top-width:2px;border-right-width:2px}
.hud i:nth-child(2){top:0;left:0;border-top-width:2px;border-left-width:2px}
.hud i:nth-child(3){bottom:0;right:0;border-bottom-width:2px;border-right-width:2px}
.hud i:nth-child(4){bottom:0;left:0;border-bottom-width:2px;border-left-width:2px}
.hud .st{position:absolute;top:6px;right:52px;font:500 16px 'JetBrains Mono','Rubik';color:var(--muted);display:flex;gap:18px;align-items:center}
.hud .st b{color:var(--cyan);font-weight:700}
.hud .st .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 10px #4ADE80;animation:blink 1.6s step-end infinite}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent,rgba(34,211,238,.10) 50%,transparent);height:120px;animation:scan 4s linear infinite;pointer-events:none}
@keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(900px)}}
/* כניסה מדורגת של כרטיסים בכל שקופית */
.s.on .tcard,.s.on .mcard,.s.on .node,.s.on .flow span,.s.on .book,.s.on .live li{animation:rise .45s cubic-bezier(.2,1.2,.4,1) both}
.s.on :is(.tcard,.mcard,.node,.book,.live li):nth-child(2),.s.on .flow span:nth-of-type(2){animation-delay:.08s}
.s.on :is(.tcard,.mcard,.node,.book,.live li):nth-child(3),.s.on .flow span:nth-of-type(3){animation-delay:.16s}
.s.on .tcard:nth-child(4),.s.on .flow span:nth-of-type(4){animation-delay:.24s}
.s.on .tcard:nth-child(5){animation-delay:.32s}.s.on .tcard:nth-child(6){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.btn,#nav button{transition:filter .2s,transform .2s}
.btn:hover,#nav button:hover{filter:brightness(1.15);transform:translateY(-1px)}
#nav{position:absolute;bottom:24px;left:40px;display:flex;gap:10px;align-items:center;z-index:5;font:500 19px 'JetBrains Mono';color:var(--muted)}
#nav button{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font-size:24px;cursor:pointer}
#nav button:focus-visible,.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#bar{position:absolute;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan));z-index:5;transition:width .4s;box-shadow:0 0 14px var(--violet)}

/* ===== פתיחה: הטרמינל בונה ===== */
.hero{flex-direction:column;align-items:center;justify-content:center;text-align:center}
.term{width:1120px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:rgba(5,8,24,.85);box-shadow:0 40px 120px rgba(139,92,246,.35);transition:transform .9s cubic-bezier(.6,0,.2,1),opacity .9s}
.tbar{display:flex;gap:9px;padding:14px 18px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line)}
.tbar i{width:13px;height:13px;border-radius:50%;background:#FF5F57}.tbar i+i{background:#FEBC2E}.tbar i+i+i{background:#28C840}
.tbody{padding:30px 36px;text-align:right;font:500 31px/1.7 'JetBrains Mono','Rubik';min-height:250px}
.tbody .ln{white-space:pre-wrap}
.tbody .p{color:var(--cyan)}
.tbody .ok{color:#4ADE80}
.tbody .dim{color:var(--muted)}
.cur{display:inline-block;width:14px;height:34px;background:var(--cyan);vertical-align:-6px;animation:blink .9s step-end infinite}
@keyframes blink{50%{opacity:0}}
.hero .title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.94);transition:opacity 1s .2s,transform 1s .2s;pointer-events:none}
.hero .title h1{font-size:250px}
.hero .title p{font-size:38px;color:var(--muted);margin-top:20px;font-weight:300}
.hero.done .term{transform:translateY(-40px) scale(.6);opacity:0}
.hero.done .title{opacity:1;transform:none}

/* ===== הסיפור שלי ===== */
.story{flex-direction:column}
.story .who{display:flex;align-items:center;gap:30px;margin-bottom:56px}
.story .who img{width:128px;height:128px;border-radius:50%;object-fit:cover;border:3px solid var(--violet);box-shadow:0 0 30px rgba(139,92,246,.6)}
.story .who h2{font-size:84px}
.story .who p{font-size:28px;color:var(--muted);margin-top:8px}
.tl{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:34px;position:relative}
.tl::before{content:'';position:absolute;top:34px;right:40px;left:40px;height:3px;background:linear-gradient(270deg,var(--muted),var(--violet),var(--cyan))}
.node{position:relative;padding-top:86px}
.node::before{content:'';position:absolute;top:20px;right:0;width:30px;height:30px;border-radius:50%;background:var(--bg);border:4px solid var(--c,var(--muted));box-shadow:0 0 18px var(--c,transparent)}
.node small{font:700 22px 'JetBrains Mono';color:var(--c,var(--muted))}
.node h3{font-size:44px;font-weight:800;margin:10px 0 12px;line-height:1.15}
.node p{font-size:27px;line-height:1.5;color:var(--muted)}
.node.now h3{color:#fff}

/* ===== התלמידים ===== */
.kids{flex-direction:column;justify-content:center;gap:30px}
.kids h2{font-size:150px;max-width:12ch}
.kids .lead{max-width:34ch}
.btn.big{font-size:32px;padding:20px 44px;margin-top:10px}
.btn.off{opacity:.4}
/* ===== עמוד מהקנבה, על כל המסך ===== */
.canva{padding:0}
.canva .media{flex:1;height:auto;border:0;border-radius:0;box-shadow:none;background:#000}
.canva .media img,.canva .media video{object-fit:contain}
/* ===== גלריה, סרטון בעיגול, לפני ואחרי ===== */
.gal,.pair{flex-direction:column}
.ghead{display:flex;flex-direction:column;gap:18px;margin-bottom:34px}
.ghead h2{font-size:96px}
.grow{flex:1;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:40px;align-items:center;justify-items:center;min-height:0}
.grow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:100%}
.grow figcaption,.prow figcaption{font:500 24px/1.45 'JetBrains Mono','Rubik';color:var(--muted);text-align:center;max-width:22ch}
.grow .sq img{max-height:470px;max-width:100%;border-radius:18px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(139,92,246,.28)}
.grow .rnd img,.rimg{width:min(420px,100%);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 3px rgba(34,211,238,.6),0 0 50px rgba(139,92,246,.55)}
.wide .grow .sq img{max-height:520px}
.wide figcaption{max-width:none}
.vc{position:relative;border-radius:50%;overflow:hidden;flex:0 0 auto;box-shadow:0 0 0 3px rgba(34,211,238,.6),0 0 60px rgba(139,92,246,.6);background:#000;cursor:pointer}
.vc video{position:absolute;max-width:none}
.vplay{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;border:0;background:rgba(7,11,31,.7);color:#fff;font-size:22px;cursor:pointer;transition:opacity .2s}
.vc.playing .vplay{opacity:0}
.vc:hover .vplay{opacity:1}
.vid.on{display:grid;grid-template-columns:1fr auto;gap:70px;align-items:center}
.vid .txt{display:flex;flex-direction:column;gap:24px}
.vid h2{font-size:110px}
.prow{flex:1;display:flex;align-items:center;justify-content:center;gap:60px}
.prow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:20px}
.prow .rimg{width:440px}
.many{display:flex;gap:16px}.many img{height:300px;border-radius:14px;border:1px solid var(--line)}
.parr{font-size:70px;color:var(--cyan);text-shadow:0 0 20px var(--cyan)}
/* ===== משפט ===== */
.statement{align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:10px}
.statement h2{font-size:150px}

/* ===== דוגמה חיה ===== */
.live{display:grid!important;grid-template-columns:1fr 880px;gap:50px;align-items:center}
.live:not(.on){display:none!important}
.live .txt{display:flex;flex-direction:column;gap:24px}
.live h2{font-size:78px}
.live .txt p{font-size:30px;line-height:1.5;color:var(--muted)}
.live ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.live li{font-size:27px;display:flex;gap:14px;align-items:center}
.live li::before{content:'';width:10px;height:10px;border-radius:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);transform:rotate(45deg)}
.btn{align-self:flex-start;font:700 22px 'Rubik';color:var(--bg);background:linear-gradient(90deg,var(--cyan),var(--violet));border:0;border-radius:999px;padding:12px 28px;text-decoration:none;cursor:pointer}
.browser{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0B1030;box-shadow:0 30px 90px rgba(34,211,238,.18),0 0 0 1px rgba(139,92,246,.25)}
.browser .bb{display:flex;align-items:center;gap:9px;padding:12px 16px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line)}
.browser .bb i{width:12px;height:12px;border-radius:50%;background:#FF5F57}.browser .bb i+i{background:#FEBC2E}.browser .bb i+i+i{background:#28C840}
.browser .url{flex:1;margin-right:12px;font:500 17px 'JetBrains Mono';color:var(--muted);background:rgba(255,255,255,.06);border-radius:8px;padding:6px 14px;direction:ltr;text-align:left}
.browser .vw{position:relative;width:880px;height:495px;overflow:hidden;background:#fff}
.browser iframe{position:absolute;top:0;left:0;width:1600px;height:900px;border:0;transform:scale(.55);transform-origin:0 0}

/* ===== כלים שבניתי לעצמי ===== */
.tools{flex-direction:column}
.tools h2{margin-bottom:14px}
.tools .lead{margin-bottom:40px}
.tgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:24px}
.tcard{padding:28px 30px;display:flex;flex-direction:column;gap:12px}
.tcard .ic{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.4)}
.tcard .ic svg{width:30px;height:30px;fill:none;stroke:var(--cyan);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tcard h3{font-size:34px;font-weight:800;margin:0}
.tcard p{font-size:24px;line-height:1.45;color:var(--muted)}

/* ===== פתיחת פרק ===== */
.sec{flex-direction:column;justify-content:center}
.sec .num{font:700 30px 'JetBrains Mono';color:var(--cyan);margin-bottom:20px}
.sec h2{font-size:170px}
.sec .lead{margin-top:26px;max-width:30ch}

/* ===== נושא ===== */
.topic{display:grid!important;grid-template-columns:1fr 1.05fr;gap:64px;align-items:center}
.topic:not(.on){display:none!important}
.topic .txt{display:flex;flex-direction:column;gap:24px;min-width:0}
.topic h2{font-size:108px}
.topic .what{font-size:34px;line-height:1.45;max-width:24ch}
.topic .vs{display:flex;flex-direction:column;gap:10px}
.topic .was{font-size:28px;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--pink)}
.topic .now{font-size:36px;font-weight:700;line-height:1.35}
.topic .now::before{content:'\2190  ';color:var(--cyan)}
.pr{padding:20px 26px;font:500 24px/1.6 'JetBrains Mono','Rubik';color:#DDE4FF;border-radius:16px;background:rgba(3,6,20,.75);border:1px solid rgba(34,211,238,.35)}
.pr small{display:block;font:700 18px 'JetBrains Mono';color:var(--cyan);margin-bottom:6px}
.pr .btn{margin-top:14px;font-size:18px;padding:8px 22px}
.media{position:relative;height:620px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0B1030;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 90px rgba(139,92,246,.22)}
.media img,.media video{width:100%;height:100%;object-fit:contain;display:block}
.media .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;color:var(--muted);font-size:20px;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.02) 0 16px,rgba(255,255,255,.05) 16px 32px)}
.media .ph b{font-size:30px;color:var(--txt);font-weight:700}
.media .ph span{font-family:'JetBrains Mono'}
.media.has .ph{display:none}
/* ספרים אמיתיים */
.books{display:flex;gap:30px;justify-content:center;align-items:flex-end;height:620px}
.book{width:250px;text-decoration:none;color:var(--txt);display:flex;flex-direction:column;gap:16px;align-items:center;transition:transform .25s}
.book:hover,.book:focus-visible{transform:translateY(-10px)}
.book .cv{width:220px;height:290px;border-radius:8px 20px 20px 8px;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:0 24px 50px rgba(0,0,0,.45),inset 12px 0 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:90px}
.book .cv svg{width:110px;height:110px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.book b{font-size:24px;text-align:center;line-height:1.3}

/* ===== שלושה מודלים ===== */
.models{flex-direction:column}
.models h2{margin-bottom:44px;font-size:76px}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.mcard{padding:38px 36px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.mcard::before{content:'';position:absolute;top:0;right:0;left:0;height:5px;background:var(--c);box-shadow:0 0 24px var(--c)}
.mcard .nm{font-size:78px;font-weight:900;color:var(--c)}
.mcard .best{font:700 20px 'JetBrains Mono';color:var(--c)}
.mcard h3{font-size:36px;font-weight:800;margin:0;line-height:1.25}
.mcard p{font-size:25px;line-height:1.5;color:var(--muted)}

/* ===== סיום ===== */
.end{flex-direction:column;justify-content:center}
.end h2{font-size:190px}
.flow{display:flex;gap:16px;align-items:center;margin-top:46px;font-size:32px;font-weight:700}
.flow span{padding:14px 26px}
.flow i{font-style:normal;color:var(--cyan);font-size:36px}
.sig{position:absolute;bottom:30px;right:110px;font-size:17px;color:var(--muted)}
.sig a{color:inherit}

@media (prefers-reduced-motion:reduce){.cur,.hero::after,.hud .st .dot{animation:none}.term,.hero .title{transition:none}.s.on *{animation:none!important}}
</style>
</head>
<body>
<div id="vp"><div id="deck">
<div id="bar"></div>
<div id="slides"></div>
<div class="hud" aria-hidden="true"><i></i><i></i><i></i><i></i><div class="st"><span class="dot"></span><b>LIVE</b><span>פסגה אשדוד</span><span>24.11</span><span id="hudn"></span></div></div>
<div id="nav"><button id="prev" type="button" aria-label="השקופית הקודמת">&rarr;</button><span id="cnt"></span><button id="next" type="button" aria-label="השקופית הבאה">&larr;</button></div>
</div></div>

<script>
/* ============ התוכן ============
   כל שקופית היא נושא אחד. media = קובץ בתיקייה assets/deck (jpg, png או mp4).
   live = אתר אמיתי שמוצג בתוך חלון דפדפן, ואפשר ללחוץ בתוכו */
const DONUT=''; // קישור למחולל הסופגניות
const STUDENTS='https://campus-hamad.github.io/botpoint/'; // הכלי שהתלמידים בנו בהאקתון
const SLIDES=[
 {k:'hero',prompt:'בנה לי אתר להשתלמות "הכלים שלא הכרתם" למורים בפסגה אשדוד, עם סקר, חדרי אתגר ופדלט',steps:['קורא את הבקשה...','בונה עמוד בית ועמוד מפגש...','מחבר סקר עם תוצאות חיות...'],title:'ממורה למפתח',sub:'שירה רוט זליקוביץ'},
 {k:'live',chip:'האקתון',h:'התלמידים שלנו כבר עפו קדימה',url:STUDENTS,show:'campus-hamad.github.io/botpoint',p:'בהאקתון, תלמידים בנו את Bot Points: כיתה בשיחת וידאו, שבה בוט מקשיב, בודק תשובות ונותן נקודות.',li:['המורה פותח כיתה ומקבל קוד','התלמידים נכנסים עם הקוד','הבוט מקשיב ומחלק נקודות']},
 {k:'vid',chip:'אני, בגרסה המונפשת',h:'הדמות שלי מדברת',p:'תמונה אחת שלי, קצת קול, והבינה הפכה אותה לדמות שמדברת.',v:{src:'assets/deck/canva/p2.mp4',cx:639,cy:365,r:358}},
 {k:'story',name:'שירה רוט זליקוביץ',role:'מומחית בטכנולוגיות בחינוך ובהוראה יצירתית עם AI',nodes:[
   {t:'פעם',h:'תקשורת חזותית, פרסום ושיווק',p:'שנים של עיצוב, רעיונות ומסרים.'},
   {t:'אחר כך',h:'טכנולוגיות בלמידה',p:'משרד החינוך, הדרכות וסדנאות למורים.',c:'#8B5CF6'},
   {t:'היום',h:'בונה כלים עם בינה',p:'אתרים, משחקים ואוטומציות שחוסכים לי שעות.',c:'#22D3EE',now:1}]},

/* ============ בונים את השקופיות ============ */
/* סרטון בתוך עיגול: מציגים רק את העיגול מתוך הסרטון (cx, cy, r בפיקסלים של סרטון ברוחב 1280) */
function vcircle(v,D){const k=D/(2*v.r);return `<div class="vc" style="width:${D}px;height:${D}px"><video src="${v.src}" playsinline preload="metadata" style="width:${1280*k}px;left:${-(v.cx-v.r)*k}px;top:${-(v.cy-v.r)*k}px"></video><button class="vplay" type="button" aria-label="הפעלה">&#9654;</button></div>`}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pid=0;
const prBox=t=>{const id='p'+(++pid);return `<div class="pr"><small>// פרומפט</small><span id="${id}">${esc(t)}</span><br><button class="btn" type="button" data-copy="${id}">העתקה</button></div>`};
const mediaBox=(f,cap)=>`<div class="media" data-src="assets/deck/${f}" data-cap="${esc(cap)}"></div>`;
const R={
 hero:d=>`<section class="s hero"><div class="term"><div class="tbar"><i></i><i></i><i></i></div><div class="tbody" id="tb"></div></div><div class="title"><h1 class="grad">${d.title}</h1><p>${d.sub}</p></div></section>`,
 story:d=>`<section class="s story"><div class="who"><img src="assets/shira.jpg" alt=""><div><h2>${d.name}</h2><p>${d.role}</p></div></div>
   <div class="tl">${d.nodes.map(n=>`<div class="node${n.now?' now':''}" style="${n.c?'--c:'+n.c:''}"><small>${n.t}</small><h3>${n.h}</h3><p>${n.p}</p></div>`).join('')}</div></section>`,
 kids:d=>`<section class="s kids"><span class="chip">האקתון</span><h2 class="grad">${d.h}</h2><p class="lead">${d.p}</p>
   ${d.url?`<a class="btn big" href="${d.url}" target="_blank" rel="noopener">לפתיחת הכלי שהתלמידים בנו</a>`:'<span class="btn big off">הקישור יופיע כאן</span>'}</section>`,
 canva:d=>`<section class="s canva"><div class="media" data-src="assets/deck/canva/${d.src}" data-cap="עמוד מהקנבה"></div></section>`,
 gal:d=>`<section class="s gal${d.wide?' wide':''}"><div class="ghead"><span class="chip">${d.chip}</span><h2>${d.h}</h2></div>
   <div class="grow" style="--n:${d.items.length}">${d.items.map(t=>`<figure class="${t.round?'rnd':'sq'}"><img src="${t.i}" alt="${esc(t.c||'')}">${t.c?`<figcaption>${t.c}</figcaption>`:''}</figure>`).join('')}</div></section>`,
 vid:d=>`<section class="s vid"><div class="txt"><span class="chip">${d.chip}</span><h2>${d.h}</h2><p class="lead">${d.p}</p></div>${vcircle(d.v,560)}</section>`,
 pair:d=>`<section class="s pair"><div class="ghead"><span class="chip">${d.chip}</span><h2>${d.h}</h2></div><div class="prow">
   <figure>${d.a.many?`<div class="many">${d.a.many.map(x=>`<img src="${x}" alt="">`).join('')}</div>`:`<img class="rimg" src="${d.a.i}" alt="">`}<figcaption>${d.a.c}</figcaption></figure>
   <span class="parr">&larr;</span><figure>${vcircle(d.b.v,440)}<figcaption>${d.b.c}</figcaption></figure></div></section>`,
 statement:d=>`<section class="s statement"><h2>${d.a}</h2><h2 class="grad">${d.b}</h2></section>`,
 live:d=>`<section class="s live"><div class="txt"><span class="chip">${d.chip||'דוגמה אמיתית'}</span><h2>${d.h}</h2><p>${d.p}</p><ul>${d.li.map(x=>`<li>${x}</li>`).join('')}</ul><a class="btn" href="${d.url}" target="_blank" rel="noopener">לפתיחה בחלון חדש</a></div>
   <div class="browser"><div class="bb"><i></i><i></i><i></i><span class="url">${d.show}</span></div><div class="vw"><iframe data-src="${d.url}" title="${esc(d.h)}" loading="lazy"></iframe></div></div></section>`,
 tools:d=>`<section class="s tools"><h2>${d.h}</h2><p class="lead">${d.lead}</p><div class="tgrid">${d.items.map(t=>`<div class="tcard glass"><span class="ic"><svg viewBox="0 0 24 24">${t.i}</svg></span><h3>${t.h}</h3><p>${t.p}</p></div>`).join('')}</div></section>`,
 sec:d=>`<section class="s sec"><div class="num">// ${d.n}</div><h2 class="grad">${d.h}</h2>${d.lead?`<p class="lead">${d.lead}</p>`:''}</section>`,
 topic:d=>`<section class="s topic"><div class="txt"><span class="chip">${d.chip}</span><h2>${d.h}</h2>${d.what?`<p class="what">${d.what}</p>`:''}
   ${d.was?`<div class="vs"><p class="was">${d.was}</p><p class="now">${d.now}</p></div>`:''}${d.prompt?prBox(d.prompt):''}
   ${d.link==='donut'?`<a class="btn" id="donutBtn" target="_blank" rel="noopener">לפתיחת המחולל</a>`:''}</div>${mediaBox(d.media,d.cap)}</section>`,
 books:d=>`<section class="s topic"><div class="txt"><span class="chip">${d.chip}</span><h2>${d.h}</h2><p class="what">${d.what}</p></div>
   <div class="books">${d.books.map(b=>`<a class="book" href="${b.u}" target="_blank" rel="noopener" style="--a:${b.a};--b:${b.b}"><span class="cv"><svg viewBox="0 0 24 24">${b.e}</svg></span><b>${b.t}</b></a>`).join('')}</div></section>`,
 models:d=>`<section class="s models"><h2>${d.h}</h2><div class="mgrid">${d.items.map(m=>`<div class="mcard glass" style="--c:${m.c}"><span class="best">// ${m.best}</span><div class="nm">${m.nm}</div><h3>${m.h}</h3><p>${m.p}</p></div>`).join('')}</div></section>`,
 end:d=>`<section class="s end"><h2 class="grad">${d.h}</h2><div class="flow">${d.flow.map((x,i)=>`${i?'<i>&larr;</i>':''}<span class="glass">${x}</span>`).join('')}</div>
   <div class="sig">© שירה רוט זליקוביץ · הוראה יצירתית עם AI · <a href="https://wa.me/972523930628" target="_blank" rel="noopener">ווטסאפ</a> · <a href="https://www.lomdot.org/" target="_blank" rel="noopener">להזמנת סדנאות</a></div></section>`
};
document.getElementById('slides').innerHTML=SLIDES.map(d=>R[d.k](d)).join('');

/* ============ הפתיחה: הבינה מקלידה ובונה ============ */
const HERO=SLIDES[0];let heroT=[];
function heroRun(){const sec=document.querySelector('.hero'),tb=document.getElementById('tb');heroT.forEach(clearTimeout);heroT=[];sec.classList.remove('done');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){sec.classList.add('done');return}
  tb.innerHTML=`<div class="ln"><span class="p">&gt; </span><span id="ty"></span><span class="cur"></span></div>`;
  const ty=document.getElementById('ty');let t=500;
  [...HERO.prompt].forEach((ch,k)=>heroT.push(setTimeout(()=>{ty.textContent+=ch},t+=38)));
  t+=500;heroT.push(setTimeout(()=>{const c=tb.querySelector('.cur');if(c)c.remove()},t));
  HERO.steps.forEach(s=>heroT.push(setTimeout(()=>tb.insertAdjacentHTML('beforeend',`<div class="ln dim">${s}</div>`),t+=650)));
  heroT.push(setTimeout(()=>tb.insertAdjacentHTML('beforeend',`<div class="ln ok">✓ האתר מוכן</div>`),t+=700));
  heroT.push(setTimeout(()=>sec.classList.add('done'),t+=1100))}

/* ============ מעבר בין שקופיות ============ */
const S=[...document.querySelectorAll('.s')];let i=-1;
function show(n){n=Math.max(0,Math.min(S.length-1,n));const same=n===i;i=n;S.forEach((s,k)=>s.classList.toggle('on',k===i));
  document.getElementById('cnt').textContent=(i+1)+' / '+S.length;document.getElementById('hudn').textContent='['+String(i+1).padStart(2,'0')+'/'+S.length+']';document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
  S[i].querySelectorAll('iframe[data-src]').forEach(f=>{if(!f.src)f.src=f.dataset.src});
  /* טוענים מראש את האתר בשקופית הבאה */
  if(S[i+1])S[i+1].querySelectorAll('iframe[data-src]').forEach(f=>{if(!f.src)f.src=f.dataset.src});
  S.forEach((s,k)=>s.querySelectorAll('video').forEach(v=>{if(k===i){v.currentTime=0;v.play().catch(()=>{})}else v.pause()}));
  document.querySelectorAll('.vc video').forEach(v=>{if(!v.closest('.s.on')){v.pause();v.closest('.vc').classList.remove('playing')}});
  S[i].querySelectorAll('.vc video').forEach(v=>{v.currentTime=0;v.play().then(()=>v.closest('.vc').classList.add('playing')).catch(()=>{})});
  if(i===0&&!same)heroRun();
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(['ArrowLeft','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}
  else if(['ArrowRight','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1);
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}});
/* תמונה או סרטון: קודם mp4, אחר כך jpg, png ו-webp */
document.querySelectorAll('.media[data-src]').forEach(m=>{const b=m.dataset.src,f=b.split('/').pop();
  m.innerHTML=`<div class="ph"><b>${m.dataset.cap||''}</b><span>assets/deck/${f}.jpg / .mp4</span></div>`;
  const v=document.createElement('video');const cv=!!m.closest('.canva');v.muted=!cv;v.loop=!cv;v.controls=cv;v.playsInline=true;v.preload='metadata';
  v.onloadeddata=()=>{m.prepend(v);m.classList.add('has');if(m.closest('.s.on'))v.play().catch(()=>{})};
  v.onerror=()=>tryImg(['.jpg','.png','.webp']);v.src=b+'.mp4';
  function tryImg(ext){if(!ext.length)return;const im=new Image();im.onload=()=>{m.prepend(im);m.classList.add('has')};im.onerror=()=>tryImg(ext.slice(1));im.src=b+ext[0]}});
document.querySelectorAll('.vc').forEach(c=>c.onclick=()=>{const v=c.querySelector('video');if(v.paused){v.play();c.classList.add('playing')}else{v.pause();c.classList.remove('playing')}});
document.querySelectorAll('button[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(document.getElementById(b.dataset.copy).textContent).then(()=>{b.textContent='הועתק';setTimeout(()=>b.textContent='העתקה',1500)}));
{const d=document.getElementById('donutBtn');if(d){if(DONUT)d.href=DONUT;else d.remove()}}
function fit(){document.getElementById('deck').style.zoom=Math.min(innerWidth/1600,innerHeight/900)}
addEventListener('resize',fit);fit();
const fromHash=()=>{const n=(parseInt(location.hash.slice(1),10)||1)-1;if(n!==i)show(n)};
addEventListener('hashchange',fromHash);fromHash();
</script>
