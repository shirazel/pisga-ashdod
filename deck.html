<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ממורה למפתח</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700;800&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
/* מחברת משבצות של מורה: עט כחול, עט אדום ומרקר צהוב. בפרק הפיתוח הדף הופך למסך עורך כהה */
:root{--paper:#F3F6FB;--grid:#D3DEEE;--ink:#1B2A6B;--red:#E63946;--hl:#FFE14D;--mint:#2EC4B6;--night:#16213E;--muted:#5B6787}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0E1630;font-family:'Rubik',sans-serif;color:var(--ink)}
#vp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{width:1600px;height:900px;flex:0 0 auto;position:relative;overflow:hidden}
.s{position:absolute;inset:0;padding:90px 130px 100px 120px;display:none;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px}
/* קו השוליים האדום של המחברת */
.s::before{content:'';position:absolute;top:0;bottom:0;right:88px;width:3px;background:var(--red);opacity:.55}
.s.on{display:flex}
.s.dark{background:var(--night);background-image:radial-gradient(rgba(255,255,255,.05) 1.5px,transparent 1.5px);background-size:32px 32px;color:#E8EEFF}
.s.dark::before{display:none}

h1,h2,.big{font-family:'Karantina',sans-serif;font-weight:700;line-height:.9;margin:0;letter-spacing:.5px}
h2{font-size:120px}
.hand{font-family:'Amatic SC',cursive;font-weight:700;color:var(--red)}
p{margin:0}
.lead{font-size:36px;line-height:1.5;color:var(--muted);max-width:32ch}
.dark .lead{color:#AFC0E8}

#nav{position:absolute;bottom:26px;left:40px;display:flex;gap:10px;align-items:center;z-index:5;font:500 20px 'Rubik';color:var(--muted)}
#nav button{width:52px;height:52px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;font-size:26px;cursor:pointer}
#nav button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
#deck.isdark #nav{color:#8FA3D6}
#bar{position:absolute;top:0;right:0;height:6px;background:var(--red);z-index:5;transition:width .4s}

/* ===== פתיחה ===== */
.s1{flex-direction:column;justify-content:center;padding-right:180px}
.s1 h1{font-size:300px;color:var(--ink)}
.s1 .from{position:relative;display:inline-block}
.s1 .from svg{position:absolute;inset:-30px -50px -10px -40px;width:calc(100% + 90px);height:calc(100% + 40px);overflow:visible}
.s1 .from path{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400}
.s1.on .from path{animation:draw 1.1s .3s ease-out forwards}
.s1 .to code{display:inline-block;font:700 290px/1 'Karantina';color:var(--ink);white-space:nowrap;border-left:10px solid transparent;padding-left:14px;clip-path:inset(0 0 0 100%);vertical-align:top}
.s1.on .to code{animation:type 1.1s 1.5s steps(5) forwards,caret .8s 2.6s step-end infinite}
.s1 .note{font-size:64px;margin-top:10px;transform:rotate(-3deg);opacity:0}
.s1.on .note{animation:pop .4s 2.8s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@keyframes caret{0%,49%{border-color:var(--red)}50%,100%{border-color:transparent}}
@keyframes pop{from{opacity:0;transform:rotate(-3deg) scale(.8)}to{opacity:1;transform:rotate(-3deg) scale(1)}}

/* ===== הסולם ===== */
.s2{flex-direction:column}
.s2 h2{margin-bottom:40px}
.ladder{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:end}
.step{background:#fff;border:3px solid var(--ink);border-radius:6px 6px 0 0;padding:26px 26px 30px;box-shadow:8px 8px 0 var(--ink)}
.step:nth-child(1){height:44%}.step:nth-child(2){height:60%}.step:nth-child(3){height:76%}.step:nth-child(4){height:94%;background:var(--hl)}
.step b{display:block;font:700 96px/1 'Karantina';color:var(--red)}
.step h3{font-size:40px;margin:4px 0 10px}
.step p{font-size:26px;line-height:1.45;color:var(--muted)}
.step:nth-child(4) p{color:var(--ink)}

/* ===== תמונות וסרטונים ===== */
.media{position:relative;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.media img,.media video{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.media .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:22px;text-align:center;padding:16px;
  background:repeating-linear-gradient(-45deg,#fff 0 14px,#F1F4FA 14px 28px)}
.media .ph b{font:700 40px 'Amatic SC';color:var(--red)}
.media.has .ph{display:none}
.dark .media,.dark .media img,.dark .media video{background:#1D2A4D}
.dark .media .ph{background:repeating-linear-gradient(-45deg,#1D2A4D 0 14px,#22305A 14px 28px);color:#8FA3D6}

/* ===== מה בניתי ===== */
.s3{flex-direction:column}
.s3 h2{margin-bottom:34px}
.polaroids{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:34px;align-items:center}
.pol{background:#fff;padding:14px 14px 0;margin:0;box-shadow:0 14px 30px rgba(27,42,107,.18)}
.pol:nth-child(odd){transform:rotate(-2.5deg)}.pol:nth-child(even){transform:rotate(2deg) translateY(20px)}
.pol .media{height:300px}
.pol .media img{object-fit:cover}
.pol figcaption{font:700 40px/1.1 'Amatic SC';color:var(--ink);text-align:center;padding:14px 4px 18px}

/* ===== משפט ===== */
.s4{align-items:center;justify-content:center;text-align:center;flex-direction:column}
.s4 .big{font-size:200px;color:var(--ink)}
.s4 .big + .big{color:var(--red)}

/* ===== פתיחת פרק ===== */
.sec{flex-direction:column;justify-content:center}
.sec .big{font-size:230px}
.sec .lead{margin-top:24px}
.sec .toc{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px}
.sec .toc span{font-size:28px;font-weight:700;border:3px solid currentColor;padding:8px 22px;background:#fff}
.dark.sec .toc span{background:transparent;color:var(--hl)}

/* ===== עמוד לכל נושא ===== */
.topic.on{display:grid;grid-template-columns:1fr 1.12fr;gap:70px;align-items:center}
.topic .txt{display:flex;flex-direction:column;gap:22px;min-width:0}
.topic .tag{align-self:flex-start;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700}
.topic .tag em{font-style:normal;background:var(--ink);color:#fff;padding:6px 16px}
.topic .tag .hand{font-size:38px}
.topic h2{font-size:150px}
.topic .what{font-size:36px;line-height:1.45;font-weight:500;max-width:24ch}
.topic .was{font-size:30px;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px}
.topic .now{font-size:38px;line-height:1.4;font-weight:700;display:flex;gap:16px;align-items:baseline}
.topic .now::before{content:'\2190';color:var(--red);font-size:40px}
.topic .pr{background:#fff;border:3px dashed var(--ink);padding:18px 24px;font-size:25px;line-height:1.55}
.topic .pr small{display:block;font:700 30px 'Amatic SC';color:var(--red);margin-bottom:2px}
.copy{margin-top:12px;font:700 20px 'Rubik';background:var(--ink);color:#fff;border:0;border-radius:999px;padding:8px 22px;cursor:pointer}
.copy:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.topic .frame{height:640px;display:flex}
.topic .frame .media{flex:1}
/* מורה: מסגרת עם צל של עט */
.topic.t .frame .media{border:3px solid var(--ink);box-shadow:12px 12px 0 var(--ink)}
/* פיתוח: חלון של מחשב */
.dark.topic .tag em{background:var(--mint);color:var(--night)}
.dark.topic h2{color:#fff}
.dark.topic .what{color:#E8EEFF}
.dark.topic .was{color:#8FA3D6}
.dark.topic .pr{background:#0F1830;border:2px solid var(--mint);color:#fff}
.dark.topic .pr small{color:var(--mint)}
.dark .copy{background:var(--mint);color:var(--night)}
.win{flex:1;display:flex;flex-direction:column;border:2px solid #34437A;border-radius:16px;overflow:hidden;background:#0F1830}
.win .tb{display:flex;gap:8px;padding:13px 18px;background:#1B2750}
.win .tb i{width:14px;height:14px;border-radius:50%;background:#FF5F57}.win .tb i+i{background:#FEBC2E}.win .tb i+i+i{background:#28C840}
.win .media{flex:1}
/* מדליק: פולרואיד עם סלוטייפ */
.topic.w .tag em{background:var(--red)}
.topic.w .frame{position:relative;background:#fff;padding:18px 18px 64px;transform:rotate(-2deg);box-shadow:0 20px 40px rgba(27,42,107,.22)}
.topic.w .frame::after{content:'';position:absolute;top:-22px;left:50%;width:170px;height:44px;margin-left:-85px;background:rgba(255,225,77,.75);transform:rotate(3deg)}
.topic.w .frame .cap{position:absolute;bottom:12px;right:0;left:0;text-align:center;font:700 38px 'Amatic SC';color:var(--ink)}
/* מודל: שם גדול בצבע שלו */
.topic.m h2{color:var(--c);font-size:190px}
.topic.m .frame .media{border:3px solid var(--ink);box-shadow:12px 12px 0 var(--c)}
.topic.m .sticker{align-self:flex-start;background:var(--hl);border:3px solid var(--ink);font:700 40px 'Amatic SC';padding:2px 20px;transform:rotate(3deg)}

/* ===== שלושה מודלים, סיכום ===== */
.s12{flex-direction:column}
.s12 h2{margin-bottom:36px}
.models{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.model{border:3px solid var(--ink);background:#fff;padding:44px 40px 36px;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:8px 8px 0 var(--ink)}
.model .nm{font:700 150px/.9 'Karantina';color:var(--c)}
.model h3{font-size:44px;margin:26px 0 0;line-height:1.25}
.model .sticker{position:absolute;top:-24px;left:24px;background:var(--hl);border:3px solid var(--ink);font:700 34px 'Amatic SC';padding:2px 18px;transform:rotate(4deg)}

/* ===== סיום ===== */
.s13{flex-direction:column;justify-content:center}
.s13 .big{font-size:250px}
.agenda{display:flex;gap:18px;margin-top:40px;font-size:34px;font-weight:700;align-items:center}
.agenda span{border:3px solid var(--ink);background:#fff;padding:12px 24px}
.agenda i{font-style:normal;color:var(--red);font-size:40px}
.sig{position:absolute;bottom:30px;right:130px;font-size:17px;color:var(--muted)}
.sig a{color:inherit}

@media (prefers-reduced-motion:reduce){
  .s1 .from path{animation:none!important;stroke-dashoffset:0}
  .s1 .to code{animation:none!important;clip-path:none}
  .s1 .note{animation:none!important;opacity:1}
}
</style>
</head>

<div id="vp"><div id="deck">
<div id="bar"></div>
<div id="slides">
<section class="s s1">
  <h1><span class="from">ממורה<svg viewBox="0 0 600 260" preserveAspectRatio="none"><path d="M560 120C560 40 420 10 280 14 120 18 30 60 34 140c4 76 140 110 300 104 150-6 236-50 226-124"/></svg></span></h1>
  <div class="to"><code>למפתח</code></div>
  <p class="note hand">וגם אתם יכולים</p>
</section>

<section class="s s2">
  <h2>ארבע מדרגות</h2>
  <div class="ladder">
    <div class="step"><b>1</b><h3>שואלים</h3><p>"תן לי רעיון לשיעור"</p></div>
    <div class="step"><b>2</b><h3>מנסחים</h3><p>מי, מה, למי ואיך זה ייראה</p></div>
    <div class="step"><b>3</b><h3>בונים עוזר</h3><p>Gem או סקיל שמכיר את הכיתה שלכם</p></div>
    <div class="step"><b>4</b><h3>מפתחים</h3><p>משחק, לומדה או אתר שלם, בלי לכתוב קוד</p></div>
  </div>

<section class="s s3">
  <h2>מה בניתי השנה</h2>
  <div class="polaroids">
    <figure class="pol"><div class="media" data-src="assets/deck/built-1" data-cap="צילום מסך של האתר"></div><figcaption>האתר שאתם רואים עכשיו</figcaption></figure>
    <figure class="pol"><div class="media" data-src="assets/deck/built-2" data-cap="צילום מסך של הגלגל"></div><figcaption>גלגל הגרלה עם השמות שלכם</figcaption></figure>
    <figure class="pol"><div class="media" data-src="assets/deck/built-3" data-cap="צילום מסך של הלוח"></div><figcaption>לוח תוצרים כמו פדלט</figcaption></figure>
    <figure class="pol"><div class="media" data-src="assets/deck/built-4" data-cap="צילום מסך של הסקר"></div><figcaption>סקר עם תוצאות חיות</figcaption></figure>
  </div>
</section>

<section class="s s4">
  <div class="big">לא צריך לדעת לתכנת.</div>
  <div class="big">צריך לדעת להסביר.</div>
</section>
</div>

<div id="nav"><button id="prev" type="button" aria-label="השקופית הקודמת">&rarr;</button><span id="cnt"></span><button id="next" type="button" aria-label="השקופית הבאה">&larr;</button></div>
</div></div>

];

/* ===== בונים את השקופיות ===== */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pid=0;
function mediaBox(t){return `<div class="media" data-src="assets/deck/${t.media}" data-cap="${esc(t.cap||'')}"></div>`}
function frame(kind,t){
  if(kind==='d')return `<div class="frame"><div class="win"><div class="tb"><i></i><i></i><i></i></div>${mediaBox(t)}</div></div>`;
  if(kind==='w')return `<div class="frame">${mediaBox(t)}<span class="cap">${t.h}</span></div>`;
  return `<div class="frame">${mediaBox(t)}</div>`}
function topicHTML(kind,t,k,n,dark){const id='p'+(++pid);
  const tag=kind==='m'?`<span class="sticker">${t.sticker}</span>`:`<div class="tag">${t.tool?`<em>${t.tool}</em>`:''}<span class="hand">${k+1} מתוך ${n}</span></div>`;
  return `<section class="s topic ${kind}${dark?' dark':''}"${t.c?` style="--c:${t.c}"`:''}><div class="txt">${tag}<h2>${t.h}</h2>
   ${t.what?`<p class="what">${t.what}</p>`:''}${t.was?`<p class="was">${t.was}</p><p class="now">${t.now}</p>`:''}
   ${t.prompt?`<div class="pr"><small>פרומפט לדוגמה</small><span id="${id}">${esc(t.prompt)}</span><br><button class="copy" type="button" data-copy="${id}">העתקה</button></div>`:''}
   ${t.link==='donut'?`<a class="copy" id="donutBtn" target="_blank" rel="noopener" style="align-self:flex-start;text-decoration:none">לפתיחת המחולל</a>`:''}
  </div>${frame(kind,t)}</section>`}
let html='';
CHAPTERS.forEach(ch=>{const dark=ch.kind==='d';
  html+=`<section class="s sec${dark?' dark':''}"><div class="big"${dark?' style="color:#fff"':''}>${ch.title}</div>${ch.lead?`<p class="lead">${ch.lead}</p>`:''}<div class="toc">${ch.topics.map(t=>`<span>${t.h}</span>`).join('')}</div></section>`;
  ch.topics.forEach((t,k)=>html+=topicHTML(ch.kind,t,k,ch.topics.length,dark))});
html+=`<section class="s s12"><h2>במשפט אחד</h2><div class="models">${CHAPTERS.find(c=>c.kind==='m').topics.map(t=>`<div class="model" style="--c:${t.c}"><span class="sticker">${t.sticker}</span><div class="nm">${t.h}</div><h3>${t.what}</h3></div>`).join('')}</div></section>`;
html+=`<section class="s s13"><div class="big">ועכשיו אתם</div><div class="agenda"><span>פרומפט טוב</span><i>&larr;</i><span>כלים שלא הכרתם</span><i>&larr;</i><span>חדרי אתגר</span><i>&larr;</i><span>מקרינים</span></div>
 <div class="sig">© שירה רוט זליקוביץ · הוראה יצירתית עם AI · <a href="https://wa.me/972523930628" target="_blank" rel="noopener">ווטסאפ</a> · <a href="https://www.lomdot.org/" target="_blank" rel="noopener">להזמנת סדנאות</a></div></section>`;
document.getElementById('slides').insertAdjacentHTML('beforeend',html);

/* ===== מעבר בין שקופיות ===== */
const S=[...document.querySelectorAll('.s')];let i=0;
function show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,k)=>s.classList.toggle('on',k===i));
  document.getElementById('cnt').textContent=(i+1)+' / '+S.length;document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
  document.getElementById('deck').classList.toggle('isdark',S[i].classList.contains('dark'));
  S.forEach((s,k)=>s.querySelectorAll('video').forEach(v=>{if(k===i){v.currentTime=0;v.play().catch(()=>{})}else v.pause()}));
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
addEventListener('keydown',e=>{if(['ArrowLeft','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}
  else if(['ArrowRight','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1);
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}});
/* תמונה או סרטון: קודם mp4, אחר כך jpg, png ו-webp. בלי קובץ מוצג מקום עם שם הקובץ */
document.querySelectorAll('.media[data-src]').forEach(m=>{const b=m.dataset.src,f=b.split('/').pop();
  m.innerHTML=`<div class="ph"><b>${m.dataset.cap||'מקום לתמונה'}</b><span>${f}.jpg או ${f}.mp4</span></div>`;
  const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.preload='metadata';
  v.onloadeddata=()=>{m.prepend(v);m.classList.add('has');if(m.closest('.s.on'))v.play().catch(()=>{})};
  v.onerror=()=>tryImg(['.jpg','.png','.webp']);v.src=b+'.mp4';
  function tryImg(ext){if(!ext.length)return;const im=new Image();im.onload=()=>{m.prepend(im);m.classList.add('has')};im.onerror=()=>tryImg(ext.slice(1));im.src=b+ext[0]}});
document.querySelectorAll('button.copy[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(document.getElementById(b.dataset.copy).textContent).then(()=>{b.textContent='הועתק';setTimeout(()=>b.textContent='העתקה',1500)}));
{const d=document.getElementById('donutBtn');if(d){if(DONUT)d.href=DONUT;else d.remove()}}
function fit(){document.getElementById('deck').style.zoom=Math.min(innerWidth/1600,innerHeight/900)}
addEventListener('resize',fit);fit();
const fromHash=()=>{const n=parseInt(location.hash.slice(1),10)||1;if(n-1!==i||!S[i].classList.contains('on'))show(n-1)};
addEventListener('hashchange',fromHash);fromHash();
</script>
</body>
</html>
